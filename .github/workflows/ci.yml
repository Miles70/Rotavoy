name: Build Validation

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      analytics-mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run lint && npm run build
        env:
          VITE_REOWN_PROJECT_ID: "00000000000000000000000000000000"
          VITE_API_BASE_URL: ""

      - name: Test hotel UI
        run: npm run test:hotel-ui

      - name: Install backend dependencies
        run: npm ci --prefix server --ignore-scripts --no-audit --no-fund

      - name: Check backend syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find server/src -name '*.js' -print0)

      - name: Install browser for hotel regression tests
        run: npx playwright install --with-deps chromium

      - name: Test multilingual SEO HTML and browser navigation
        run: npm run test:travel-seo

      - name: Save SEO screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travel-seo-screenshots
          path: test-results/seo
          if-no-files-found: ignore

      - name: Test desktop and mobile hotel flow
        run: npm run test:hotel-e2e

      - name: Test Analytics V2 with isolated MongoDB and browser
        run: npm run test:analytics-e2e
        env:
          ANALYTICS_TEST_MONGODB_URI: mongodb://127.0.0.1:27017

      - name: Save analytics UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-v2-screenshots
          path: test-results/analytics-v2
          if-no-files-found: ignore

      - name: Save hotel UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotel-ui-screenshots
          path: test-results/hotel-ui
          if-no-files-found: ignore

      - name: Test backend
        run: npm --prefix server test

      - name: Block high-severity dependency vulnerabilities
        run: npm run security:check
