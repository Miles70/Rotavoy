name: Build Validation

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run lint && npm run build

      - name: Test hotel UI
        run: npm run test:hotel-ui

      - name: Install backend dependencies
        run: npm ci --prefix server --ignore-scripts --no-audit --no-fund

      - name: Check backend syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find server/src -name '*.js' -print0)

      - name: Install browser for hotel regression tests
        run: npx playwright install --with-deps chromium

      - name: Test desktop and mobile hotel flow
        run: npm run test:hotel-e2e

      - name: Save hotel UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hotel-ui-screenshots
          path: test-results/hotel-ui
          if-no-files-found: ignore

      - name: Test backend
        run: npm --prefix server test

      - name: Block high-severity dependency vulnerabilities
        run: npm run security:check
